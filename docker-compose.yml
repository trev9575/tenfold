services:
  tenfold:
    # Use the image GitHub builds for you (replace trev9575, all lowercase)…
    image: ghcr.io/trev9575/tenfold:latest
    # …or comment out the line above and uncomment this to build from the source folder:
    # build: .
    container_name: tenfold
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - TZ=America/New_York
      # Set to true only if you serve Tenfold over HTTPS (e.g. behind a reverse proxy)
      - COOKIE_SECURE=false
    volumes:
      - /mnt/user/appdata/tenfold:/data
